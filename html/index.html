<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gmail - Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
      text-align: center;
      width: 300px;
    }
    .logo {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .logo span:nth-child(1) { color: #4285F4; } /* G - Blue */
    .logo span:nth-child(2) { color: #DB4437; } /* m - Red */
    .logo span:nth-child(3) { color: #F4B400; } /* a - Yellow */
    .logo span:nth-child(4) { color: #0F9D58; } /* i - Green */
    .logo span:nth-child(5) { color: #DB4437; } /* l - Red */
    h2 {
      margin-bottom: 20px;
      font-weight: normal;
      font-size: 24px;
      color: #202124;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 20px;
      background-color: #1a73e8;
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    p {
      font-size: 12px;
      color: #555;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span>G</span><span>m</span><span>a</span><span>i</span><span>l</span>
    </div>
    <h2>Sign in</h2>
    <form>
      <input type="email" placeholder="Email or phone" required><br>
      <input type="password" placeholder="Enter your password" required><br>
      <button type="submit">Next</button>
    </form>
    <p>Not your computer? Use Guest mode to sign in privately.</p>
  </div>
</body>
</html>
